version: '3.8'

services:
  my-app:
    build: .
    container_name: fastapi-app
    # Мы не пробрасываем порт 8000 наружу, так как доступ будет через Nginx
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8000:80"
    volumes:
      # Монтируем наш конфиг внутрь контейнера Nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - my-app